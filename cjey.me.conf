# https://cjey.me

server {
    listen      80;
    server_name cjey.me;
    return      301 https://$host$request_uri;
}

server {
    listen      443 ssl http2;
    server_name cjey.me;

    root        /www/cjey.me;
    index       index.html;

    # --- TLS ---------------------------------------------------------------
    # Mozilla Intermediate profile (covers 99% of clients in use as of 2025).
    # See: https://ssl-config.mozilla.org/
    ssl_certificate              /www/certs/cjey.me.crt;
    ssl_certificate_key          /www/certs/cjey.me.key;
    ssl_dhparam                  /www/certs/cjey.me.dhparam;

    ssl_protocols                TLSv1.2 TLSv1.3;
    ssl_ciphers                  ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers    off;

    ssl_session_cache            shared:cjey.me:25m;
    ssl_session_timeout          1d;
    ssl_session_tickets          off;

    # OCSP stapling
    ssl_stapling                 on;
    ssl_stapling_verify          on;
    resolver                     1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout             5s;

    # --- Security headers --------------------------------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options                SAMEORIGIN always;
    add_header X-Content-Type-Options         nosniff    always;
    add_header Referrer-Policy                strict-origin-when-cross-origin always;
    add_header Permissions-Policy             "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    # Content-Security-Policy: review per page before enabling, may break inline scripts.
    #add_header Content-Security-Policy        "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    client_max_body_size 8k;

    error_page 404 = @404;
    location @404 {
        return 302 /404.html;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log    off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log    off;
    }

    # Long-cache hashed static assets generated by Hexo / NexT.
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpe?g|gif|ico)$ {
        expires    30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location ~ ^/\.git {
        return 404;
    }
}
